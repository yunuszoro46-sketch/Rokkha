# Render Blueprint: hosts the Rokkha backend (FastAPI) as a public web service.
# Use it from the Render dashboard: New > Blueprint > pick this repository.
# Steps and limits: Backend/readme.md, section "Hosting on Render".

services:
  - type: web
    name: rokkha-backend
    runtime: python
    plan: free
    region: singapore          # the closest Render region to Bangladesh
    branch: main
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

      # The MongoDB Atlas connection string. A secret: it is NOT in this
      # file. Render asks for it once when the Blueprint is created.
      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DATABASE
        value: climate_shield

      # Websites allowed to call the API from a browser (JSON list).
      - key: CORS_ORIGINS
        value: '["https://rokkha-app.vercel.app", "http://localhost:3000", "http://127.0.0.1:3000"]'

      # Public server: nobody can change shared data through it (see app/core/config.py).
      - key: PUBLIC_READ_ONLY
        value: "true"

      - key: DEBUG
        value: "false"
