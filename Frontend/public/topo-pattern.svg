<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <!-- Subtle Topographic Contour Isolines -->
  <g stroke="#183026" stroke-width="0.75" stroke-opacity="0.08" fill="none">
    <path d="M-50,120 Q120,40 280,110 T650,80" />
    <path d="M-40,160 Q100,90 260,170 T660,130" />
    <path d="M-30,210 Q90,140 240,230 T640,190" />
    <path d="M-60,280 Q80,210 220,300 T650,260" />
    <path d="M-40,360 Q110,290 230,370 T670,330" />
    <path d="M-50,430 Q140,360 270,440 T650,410" />
    <path d="M-30,500 Q180,430 310,510 T660,490" />
    
    <!-- Concentric Hills / Basins -->
    <ellipse cx="480" cy="180" rx="90" ry="60" transform="rotate(-15 480 180)" />
    <ellipse cx="480" cy="180" rx="65" ry="42" transform="rotate(-15 480 180)" />
    <ellipse cx="480" cy="180" rx="40" ry="24" transform="rotate(-15 480 180)" />

    <ellipse cx="120" cy="440" rx="110" ry="70" transform="rotate(20 120 440)" />
    <ellipse cx="120" cy="440" rx="80" ry="50" transform="rotate(20 120 440)" />
    <ellipse cx="120" cy="440" rx="50" ry="30" transform="rotate(20 120 440)" />
  </g>

  <!-- Faint Geodetic Coordinate Grid Lines & Labels -->
  <g stroke="#183026" stroke-width="0.5" stroke-opacity="0.06" stroke-dasharray="4 4">
    <line x1="80" y1="0" x2="80" y2="600" />
    <line x1="280" y1="0" x2="280" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="0" y1="520" x2="600" y2="520" />
  </g>

  <g fill="#183026" fill-opacity="0.15" font-family="monospace" font-size="9">
    <text x="84" y="24">28°W</text>
    <text x="284" y="24">24°W</text>
    <text x="484" y="24">20°W</text>
    <text x="6" y="146">30°E</text>
    <text x="6" y="346">25°E</text>
    <text x="6" y="516">20°E</text>
  </g>
</svg>