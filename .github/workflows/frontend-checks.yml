# Checks every change to the portal before it can reach production:
# install (from the lockfile), TypeScript type check, production build and the unit tests.
# No secrets are needed. The browser tests (Frontend/tests/e2e) need a running backend on a LOCAL
# test database and local test accounts, so they are run on a developer machine, not here
# (see Frontend/playwright.config.ts and Backend/scripts/seed_local_test_accounts.py).

name: Frontend checks

on:
  pull_request:
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches:
      - production
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npx playwright test --project=unit
