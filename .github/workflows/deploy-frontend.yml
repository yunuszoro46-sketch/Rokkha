name: Deploy Previous Production to Vercel

on:
  push:
    branches:
      - previous-production
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        working-directory: Frontend
        env:
          VERCEL_ORG_ID: team_8i8eMSPvyI8iDiL6GpHBN1Ym
        run: |
          rm -rf ../.git
          vercel deploy --prod --project=rokkha-previous --create-if-missing --token=${{ secrets.VERCEL_TOKEN }} --yes
